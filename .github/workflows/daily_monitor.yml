name: Daily monitor refresh

# Rebuilds the monitor from the upstream breadth-thrust-etf engine outputs.
#
# Timing: Mon-Fri 23:40 UTC (moved from 22:10 on 2026-07-03). The engine's
# daily mark-to-market is SCHEDULED at 21:30 UTC but GitHub fires crons
# late: its publishes were measured landing 22:35-23:18 UTC. A 22:10
# monitor cron firing promptly could therefore fetch BEFORE the engine
# published and bake yesterday's data as latest — a green run, no banner
# (the price budget tolerates 1 day), silently wrong. 23:40 clears the
# engine's observed tail; the capture-integrity step below emails if the
# residual tail is ever hit. With this repo's own cron delays (measured
# 62-90 min) the job lands ~00:40-01:10 UTC = 08:40-09:10 SGT.
#
# Sunday (added 2026-09-06): the engine's weekend run RESTATES the deployed
# history (its 2026-09-06 run moved the series start and the whole path) and
# its factsheet email goes out the same day, so a Mon-Fri-only cadence left
# this page on the previous vintage until Monday night — the two surfaces
# disagreed on YTD for a day and a half. 07:00 UTC (15:00 SGT) clears the
# engine's Sunday 01:00 UTC scheduled run and the factsheet send that
# follows it; the same cron-delay tail applies.
#
# The cron clears the ENGINE's publish tail but lands inside the market-data
# VENDOR's: yfinance posted the 2026-09-08 US bar between 01:30 and 02:03 UTC,
# after that night's build, which then published a 2026-09-08 NAV against a
# 2026-09-04 benchmark. The build step waits for that tail instead of moving the
# cron later and delaying every healthy day by an hour (see benchmarks.py).
#
# What it does NOT do: re-run the strategy. The monitor is a read-only consumer
# of the engine's published outputs.
# Hourly probes close the daily-build/post-fill ordering race. They install no
# dependencies and rebuild only when a consumed engine blob has changed.
# GitHub may delay cron delivery; the sentinel enforces the separate sync budget.
# Recovery uses these probes too. Self-dispatch chains reset their attempt count
# on every scheduled run, so their per-chain limit did not bound stale incidents.
# Unchanged blobs now cost one probe, with no sleeping runner or follow-up run.

on:
  schedule:
    - cron: '17 * * * *'     # hourly source-change probe; unchanged inputs skip the build
    - cron: '40 23 * * 1-5'   # Mon-Fri 23:40 UTC (early morning SGT)
    - cron: '0 7 * * 0'       # Sun 07:00 UTC (15:00 SGT): after the engine's weekend restatement
  workflow_dispatch:
    inputs:
      catchup_attempt:
        description: 'Legacy compatibility input; positive values perform one source-change probe'
        type: number
        default: 0

permissions:
  contents: write

env:
  CATCHUP_ATTEMPT: ${{ inputs.catchup_attempt || 0 }}

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Retains headroom for the existing 24-minute benchmark-tail budget,
    # plus setup, build and tests. Source probes do not wait or self-dispatch.
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Check for a new engine publication
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY_IF_CHANGED: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') || inputs.catchup_attempt > 0 }}
        run: |
          if [ "$ONLY_IF_CHANGED" = "true" ]; then
            python scripts/sync_source.py --only-if-changed
          else
            python scripts/sync_source.py
          fi

      - name: Set up Python
        if: steps.source.outputs.rebuild == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.source.outputs.rebuild == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Build dataset + bake dashboard
        if: steps.source.outputs.rebuild == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py

      - name: Run tests
        if: steps.source.outputs.rebuild == 'true'
        run: python -m pytest tests/ -q

      # ----- Capture integrity (2026-07-03) -----
      # Anchors the BAKED dataset's live as-of to the true NYSE calendar.
      # warn (lag or non-ok health) -> email but still publish: this repo
      # surfaces upstream problems, it does not go dark on them.
      # fail (corrupt artefact) -> the job stops here, nothing publishes.
      - name: Check capture integrity
        if: steps.source.outputs.rebuild == 'true'
        id: capture
        run: python scripts/check_capture_integrity.py

      - name: Email capture warning
        if: steps.capture.outputs.capture_warn == 'true' && env.CATCHUP_ATTEMPT == '0'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[WARN] Multi-Strategy monitor — ${{ steps.capture.outputs.summary }}'
          # Ops alerts go to the operator only.
          to: ${{ secrets.GMAIL_USER }}
          from: 'Multi-Strategy Monitor Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.capture.outputs.detail }}

            The dashboard has still been published (staleness is surfaced,
            never hidden). If the engine published late, re-run this
            workflow via the 'Run workflow' button once the engine data
            is on main.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit refreshed output
        if: steps.source.outputs.rebuild == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Multi-Strategy Monitor Bot"
          git add docs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Daily monitor refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || exit 1
          done
          echo "::error::Monitor output could not be pushed after 3 attempts."
          exit 1

      - name: Report upstream recovery status
        run: python scripts/catchup_refresh.py schedule --attempt "$CATCHUP_ATTEMPT"

      # ----- Failure alert (2026-07-03) -----
      # A fetch, build, test or capture failure previously died silently
      # and the dashboard froze at its last committed state. if: failure()
      # fires when any earlier step failed. Requires the GMAIL_USER and
      # GMAIL_APP_PASSWORD repository secrets (same pair as the engine
      # repo); until they are set this step errors harmlessly inside an
      # already-failed run.
      - name: Email failure alert
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[FAIL] Multi-Strategy monitor did not publish — dashboard frozen at last state'
          to: ${{ secrets.GMAIL_USER }}
          from: 'Multi-Strategy Monitor Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            The scheduled monitor build failed. The deployed dashboard
            stays at its last committed state until a run succeeds.

            For a transient failure (network, yfinance, raw fetch),
            'Re-run failed jobs' is fine. If the cause is upstream engine
            data, fix the engine first, then start a NEW run here via the
            'Run workflow' button.

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
