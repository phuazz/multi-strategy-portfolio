name: Morning portfolio email

on:
  schedule:
    # UTC; Singapore is UTC+8 with no daylight-saving change.
    - cron: '0,15,30,45 1-2 * * 2-6'  # 09:00 target; quarter-hour readiness checks
    - cron: '0 3-15 * * 2-6'           # 11:00 delay notice; hourly recovery to 23:00
  workflow_run:
    workflows: ['Daily monitor refresh', 'pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      context_check_only:
        description: 'Read-only private briefing transport check; no email'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morning-portfolio-email
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mail.txt
      - name: Install reporting dependencies
        run: pip install -r requirements-mail.txt pytest
      - name: Install the layout-check browser
        run: python -m playwright install --with-deps chromium
      - name: Verify the delivery guards
        run: python -m pytest tests/test_morning_report.py tests/test_morning_delivery.py tests/test_morning_visuals.py tests/test_historical_attribution.py tests/test_return_context.py tests/test_etf_return_context.py tests/test_portfolio_commentary.py tests/test_private_market_context.py -q
      - name: Check deployed data and deliver once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MORNING_REPORT_TO: ${{ secrets.MORNING_REPORT_TO }}
          MORNING_BRIEF_SENDER: ${{ secrets.MORNING_BRIEF_SENDER }}
          MORNING_BRIEF_SUBJECT: ${{ secrets.MORNING_BRIEF_SUBJECT }}
          CONTEXT_CHECK_ONLY: ${{ inputs.context_check_only }}
        run: |
          if [ "$CONTEXT_CHECK_ONLY" = "true" ]; then
            python scripts/deliver_morning.py --check-context
          else
            python scripts/deliver_morning.py --send
          fi
      - name: Preserve content-free delivery status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-email-check-${{ github.run_id }}
          # Never upload email, PDF, JSON companion or rendered screenshots.
          path: data/morning-email/check.json
          retention-days: 7
          if-no-files-found: ignore
